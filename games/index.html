<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ajg-web-games</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            margin-bottom: 30px;
            font-size: 36px;
        }
        .game-card {
            background-color: #2c2c2c;
            border: 2px solid #4CAF50;
            border-radius: 10px;
            padding: 30px 50px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        .game-card:hover {
            transform: scale(1.05);
            background-color: #383838;
        }
        .game-title {
            font-size: 28px;
            font-weight: bold;
            margin: 0;
        }
    </style>
</head>
<body>

    <h1>ajg-web-games</h1>

    <a href="https://ajg-web-games.pages.dev/minecraft" class="game-card">
        <div class="game-title">minecraft</div>
    </a>

</body>
</html>
